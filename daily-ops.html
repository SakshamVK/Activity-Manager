<!-- PWA Manifest inline via JS blob -->
<script>
const manifestData = {
  name: "Daily Ops – Activity Tracker",
  short_name: "Daily Ops",
  description: "Your personal daily activity & productivity tracker",
  start_url: "./",
  display: "standalone",
  background_color: "#0d0f14",
  theme_color: "#0d0f14",
  orientation: "portrait",
  icons: [
    { src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='32' fill='%230d0f14'/%3E%3Ctext x='96' y='130' font-size='100' text-anchor='middle'%3E%F0%9F%93%8B%3C/text%3E%3C/svg%3E", sizes: "192x192", type: "image/svg+xml" },
    { src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='80' fill='%230d0f14'/%3E%3Ctext x='256' y='360' font-size='280' text-anchor='middle'%3E%F0%9F%93%8B%3C/text%3E%3C/svg%3E", sizes: "512x512", type: "image/svg+xml" }
  ]
};
const blob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
const manifestURL = URL.createObjectURL(blob);
document.write('<link rel="manifest" href="' + manifestURL + '">');
</script>

<style>
  :root {
    --bg: #0d0f14;
    --surface: #131824;
    --surface2: #1a2030;
    --border: #2a2e3a;
    --gold: #c9a84c;
    --gold-light: #f0c96a;
    --gold-dim: #c9a84c22;
    --text: #e8e0d0;
    --text-dim: #a89a7a;
    --text-muted: #666;
    --green: #5cb85c;
    --red: #e05252;
    --blue: #4d9de0;
    --purple: #9b59b6;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Georgia', 'Times New Roman', serif;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* ── Header ── */
  #header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: linear-gradient(135deg, #0d0f14 0%, #131824 100%);
    border-bottom: 1px solid var(--gold-dim);
    padding: calc(var(--safe-top) + 14px) 16px 12px;
  }

  .header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }

  .app-title { font-size: 22px; font-weight: 700; color: var(--gold); letter-spacing: 0.06em; line-height: 1; }
  .app-date { font-size: 10px; color: var(--text-muted); margin-top: 3px; letter-spacing: 0.12em; text-transform: uppercase; }

  .streak-badge {
    background: #c9a84c15; border: 1px solid #c9a84c44;
    border-radius: 10px; padding: 6px 14px; text-align: center;
  }
  .streak-num { font-size: 22px; font-weight: 700; color: var(--gold); line-height: 1; font-family: monospace; }
  .streak-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 1px; }

  .progress-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .big-pct { font-size: 38px; font-weight: 700; color: var(--gold); line-height: 1; font-family: monospace; min-width: 80px; }
  .big-pct span { font-size: 16px; color: var(--text-muted); }
  .pct-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }
  .progress-bars { flex: 1; }
  .main-bar { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; margin-bottom: 5px; }
  .main-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; background: linear-gradient(90deg, var(--gold), var(--gold-light)); }
  .main-bar-fill.complete { background: var(--green); }
  .cat-bars { display: flex; gap: 2px; }
  .cat-mini-bar { flex: 1; height: 3px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
  .cat-mini-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }

  /* ── Nav ── */
  .nav {
    display: flex; gap: 4px; background: var(--bg);
    border-radius: 10px; padding: 3px;
  }
  .nav-btn {
    flex: 1; padding: 8px 4px; border: none; border-radius: 8px;
    background: transparent; color: var(--text-muted);
    font-size: 11px; font-weight: 400; cursor: pointer;
    letter-spacing: 0.06em; text-transform: uppercase;
    transition: all 0.2s; font-family: inherit;
  }
  .nav-btn.active { background: var(--gold); color: var(--bg); font-weight: 700; }

  /* ── Body ── */
  #body {
    padding: 16px 16px 0;
    padding-bottom: calc(var(--safe-bottom) + 24px);
  }

  /* ── Quote ── */
  .quote-card {
    background: var(--surface); border: 1px solid var(--gold-dim);
    border-left: 3px solid var(--gold); border-radius: 10px;

  }
  .quote-text { font-size: 13px; color: var(--text-dim); font-style: italic; line-height: 1.6; }
  .quote-author { font-size: 11px; color: var(--text-muted); margin-top: 5px; }

  /* ── Category ── */
  .cat-section { margin-bottom: 14px; }
  .cat-header {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    padding: 9px 12px; border-radius: 8px; cursor: default;
  }
  .cat-header-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; flex: 1; }
  .cat-mini { width: 55px; height: 3px; background: rgba(0,0,0,0.3); border-radius: 2px; overflow: hidden; }
  .cat-mini-inner { height: 100%; border-radius: 2px; transition: width 0.4s; }
  .cat-pct-text { font-size: 12px; font-weight: 700; font-family: monospace; min-width: 36px; text-align: right; }

  /* ── Activity Item ── */
  .activity-item {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; margin-bottom: 6px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--border);
    cursor: pointer; transition: background 0.2s, border-color 0.2s;
    user-select: none; -webkit-user-select: none;
  }
  .activity-item.done { background: #1a2a1a; border-color: #5cb85c33; }
  .activity-item:active { transform: scale(0.98); }

  .checkbox {
    width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
    border: 2px solid #3a3f50; background: transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; transition: all 0.2s; color: white;
  }
  .checkbox.checked { border-color: var(--green); background: var(--green); }

  .act-emoji { font-size: 16px; flex-shrink: 0; }
  .act-label { font-size: 14px; color: var(--text); flex: 1; line-height: 1.3; transition: color 0.2s; }
  .act-label.done { color: #6a9a6a; text-decoration: line-through; }

  /* ── Stats ── */
  .stat-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .stat-card {
    flex: 1; background: var(--surface); border: 1px solid var(--border);

  }
  .stat-val { font-size: 26px; font-weight: 700; color: var(--gold); font-family: monospace; }
  .stat-lbl { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }

  /* ── Section Title ── */
  .section-title {
    font-size: 11px; font-weight: 700; color: var(--gold);
    text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 10px; margin-top: 4px;
  }

  /* ── Day Grid ── */
  .day-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 16px; }
  .day-cell {
    border-radius: 8px; padding: 7px 3px; text-align: center;

  .day-cell-date { font-size: 9px; color: #555; letter-spacing: 0.03em; }
  .day-cell-pct { font-size: 14px; font-weight: 700; font-family: monospace; margin-top: 2px; }

  /* ── Cat Stat Bars ── */
  .cat-stat-row { margin-bottom: 10px; }
  .cat-stat-label { display: flex; justify-content: space-between; margin-bottom: 5px; }
  .cat-stat-name { font-size: 12px; color: var(--text-dim); }
  .cat-stat-pct { font-size: 12px; font-family: monospace; }
  .cat-stat-bar { height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
  .cat-stat-fill { height: 100%; border-radius: 3px; transition: width 0.4s; }

  /* ── Insight Cards ── */
  .insight-card {
    background: var(--surface); border: 1px solid var(--gold-dim);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 10px;
  }
  .insight-title { font-size: 11px; color: var(--gold); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 5px; }
  .insight-text { font-size: 13px; color: var(--text-dim); line-height: 1.5; }

  /* ── Heatmap ── */
  .heatmap { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 16px; }
  .heat-cell { height: 30px; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
  .heat-num { font-size: 8px; }

  /* ── Week bars ── */
  .week-bars { display: flex; gap: 6px; margin-bottom: 16px; align-items: flex-end; }
  .week-bar-wrap { flex: 1; text-align: center; }
  .week-bar-pct { font-size: 12px; font-weight: 700; color: var(--gold); font-family: monospace; margin-bottom: 4px; }
  .week-bar { border-radius: 4px 4px 0 0; background: linear-gradient(180deg, var(--gold), #8a5c1a); min-height: 6px; transition: height 0.4s; }
  .week-bar-label { font-size: 10px; color: var(--text-muted); margin-top: 4px; }

  /* ── Manage ── */
  .add-row { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .add-emoji-input {
    width: 44px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); padding: 8px 6px;
    font-size: 16px; text-align: center; outline: none; font-family: inherit;
  }
  .add-text-input {
    flex: 1; min-width: 120px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); padding: 8px 10px;
    font-size: 13px; outline: none; font-family: inherit;
  }
  .add-text-input:focus, .add-emoji-input:focus { border-color: var(--gold); }
  select {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); padding: 8px 10px;
    font-size: 12px; outline: none; font-family: inherit;
    -webkit-appearance: none;
  }
  .add-btn {
    background: var(--gold); color: var(--bg); border: none;
    border-radius: 8px; padding: 8px 16px; font-weight: 700;
    font-size: 13px; cursor: pointer; font-family: inherit;
    white-space: nowrap;
  }
  .manage-cat-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.1em; margin-bottom: 8px; margin-top: 4px;
  }
  .manage-item {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; margin-bottom: 6px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--border);
  }
  .manage-label { flex: 1; font-size: 13px; color: var(--text-dim); }
  .edit-input {
    flex: 1; background: var(--bg); border: 1px solid var(--gold);
    border-radius: 6px; color: var(--text); padding: 4px 8px;
    font-size: 13px; outline: none; font-family: inherit;
  }
  .icon-btn {
    background: none; border: none; cursor: pointer; font-size: 15px;
    padding: 2px 4px; opacity: 0.8; transition: opacity 0.2s;
  }
  .icon-btn:active { opacity: 1; }

  /* ── Notes ── */
  .note-area {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text-dim); padding: 12px;
    font-size: 13px; font-family: inherit; line-height: 1.6;
    resize: vertical; min-height: 100px; outline: none;
  }
  .note-area:focus { border-color: var(--gold); }
  .save-btn {
    background: var(--surface2); border: 1px solid var(--blue);
    color: var(--blue); border-radius: 8px; padding: 8px 16px;
    font-size: 12px; cursor: pointer; margin-top: 8px; font-family: inherit;
  }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: calc(var(--safe-bottom) + 20px); left: 50%;
    transform: translateX(-50%) translateY(20px); opacity: 0;
    background: var(--green); color: white; border-radius: 20px;
    padding: 8px 20px; font-size: 13px; font-weight: 700;
    transition: all 0.3s; pointer-events: none; z-index: 999;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* ── Loading ── */
  #loading {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: var(--gold); letter-spacing: 0.2em;
    text-transform: uppercase; z-index: 999;
  }

  /* Install banner */
  #install-banner {
    display: none; position: fixed; bottom: calc(var(--safe-bottom) + 16px);
    left: 16px; right: 16px; z-index: 200;
    background: var(--surface); border: 1px solid var(--gold);
    border-radius: 14px; padding: 14px 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .install-text { font-size: 13px; color: var(--text-dim); margin-bottom: 10px; line-height: 1.4; }
  .install-btns { display: flex; gap: 8px; }
  .install-yes { background: var(--gold); color: var(--bg); border: none; border-radius: 8px; padding: 8px 20px; font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit; }
  .install-no { background: none; border: 1px solid var(--border); color: var(--text-muted); border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer; font-family: inherit; }
</style>
</head>

<div id="header">
  <div class="header-top">
    <div>

<div id="body" style="margin-top:0"></div>
<div class="toast" id="toast"></div>

<script>
// ─── Constants ──────────────────────────────────────────────────────────────
const QUOTES = [
  {text:"We are what we repeatedly do. Excellence, then, is not an act, but a habit.",author:"Aristotle"},
  {text:"The secret of getting ahead is getting started.",author:"Mark Twain"},
  {text:"Small daily improvements over time lead to stunning results.",author:"Robin Sharma"},
  {text:"Discipline is choosing between what you want now and what you want most.",author:"Augusta F. Kantra"},
  {text:"You don't have to be great to start, but you have to start to be great.",author:"Zig Ziglar"},
  {text:"It does not matter how slowly you go as long as you do not stop.",author:"Confucius"},
  {text:"Success is the sum of small efforts repeated day in and day out.",author:"Robert Collier"},
  {text:"Your future is created by what you do today, not tomorrow.",author:"Robert Kiyosaki"},
  {text:"The only way to do great work is to love what you do.",author:"Steve Jobs"},
  {text:"Action is the foundational key to all success.",author:"Pablo Picasso"},
  {text:"Focus on being productive instead of busy.",author:"Tim Ferriss"},
  {text:"Don't count the days. Make the days count.",author:"Muhammad Ali"},
  {text:"One day or day one. You decide.",author:"Unknown"},
  {text:"The journey of a thousand miles begins with one step.",author:"Lao Tzu"},
  {text:"Either you run the day or the day runs you.",author:"Jim Rohn"},
  {text:"What you do today can improve all your tomorrows.",author:"Ralph Marston"},
];

const CATEGORIES = ["Daily Activities","Food","Physical Activity","Mental Wellness","Study"];

const CAT_META = {
  "Daily Activities": { accent:"#4d9de0", bg:"#1a274422", icon:"📋" },
  "Food":             { accent:"#5cb85c", bg:"#1a2e1a22", icon:"🍽️" },
  "Physical Activity":{ accent:"#e05252", bg:"#2e1a1a22", icon:"💪" },
  "Mental Wellness":  { accent:"#9b59b6", bg:"#251a2e22", icon:"🧘" },
  "Study":            { accent:"#f39c12", bg:"#2e2a1a22", icon:"📚" },
};

const DEFAULT_ACTIVITIES = [
  {id:"a1",category:"Daily Activities",label:"Wake up before 7 AM",emoji:"🌅"},
  {id:"a2",category:"Daily Activities",label:"Make your bed",emoji:"🛏️"},
  {id:"a3",category:"Daily Activities",label:"Personal hygiene routine",emoji:"🪥"},
  {id:"a4",category:"Daily Activities",label:"Review daily goals",emoji:"📋"},
  {id:"a5",category:"Food",label:"Healthy breakfast",emoji:"🥣"},
  {id:"a6",category:"Food",label:"Drink 8 glasses of water",emoji:"💧"},
  {id:"a7",category:"Food",label:"Eat vegetables/fruits",emoji:"🥦"},
  {id:"a8",category:"Food",label:"Avoid junk food",emoji:"🚫"},
  {id:"a9",category:"Physical Activity",label:"30-min workout/exercise",emoji:"🏋️"},
  {id:"a10",category:"Physical Activity",label:"Evening walk",emoji:"🚶"},
  {id:"a11",category:"Physical Activity",label:"Stretching/yoga",emoji:"🧘"},
  {id:"a12",category:"Mental Wellness",label:"10-min meditation",emoji:"🧠"},
  {id:"a13",category:"Mental Wellness",label:"Journaling",emoji:"📝"},
  {id:"a14",category:"Mental Wellness",label:"Digital detox (30 min)",emoji:"📵"},
  {id:"a15",category:"Mental Wellness",label:"Gratitude practice",emoji:"🙏"},
  {id:"a16",category:"Study",label:"Deep work session (2h)",emoji:"💻"},
  {id:"a17",category:"Study",label:"Read for 30 minutes",emoji:"📚"},
  {id:"a18",category:"Study",label:"Review notes/flashcards",emoji:"🗂️"},
  {id:"a19",category:"Study",label:"Learn something new",emoji:"✨"},
];

// ─── State ───────────────────────────────────────────────────────────────────
let activities = JSON.parse(localStorage.getItem("ops_activities") || "null") || DEFAULT_ACTIVITIES;
let log = JSON.parse(localStorage.getItem("ops_log") || "{}");
let notes = JSON.parse(localStorage.getItem("ops_notes") || "{}");
let currentView = "today";
let editingId = null;

function save() {
  localStorage.setItem("ops_activities", JSON.stringify(activities));
  localStorage.setItem("ops_log", JSON.stringify(log));
  localStorage.setItem("ops_notes", JSON.stringify(notes));
}

// ─── Date Helpers ────────────────────────────────────────────────────────────
function todayKey() { return new Date().toISOString().slice(0,10); }
function fmtDate(k) {
  const d = new Date(k+"T00:00:00");
  return d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
}
function getDays(n) {
  return Array.from({length:n},(_,i)=>{ const d=new Date(); d.setDate(d.getDate()-(n-1-i)); return d.toISOString().slice(0,10); });
}

// ─── Calculations ─────────────────────────────────────────────────────────────
function getDayPct(dateKey) {
  if (!activities.length) return 0;
  const dl = log[dateKey] || {};
  return Math.round(activities.filter(a=>dl[a.id]).length / activities.length * 100);
}
function getCatPct(cat, dateKey) {
  const cats = activities.filter(a=>a.category===cat);
  if (!cats.length) return 0;
  const dl = log[dateKey] || {};
  return Math.round(cats.filter(a=>dl[a.id]).length / cats.length * 100);
}
function calcStreak() {
  let s=0; const d=new Date();
  while(true) {
    const k=d.toISOString().slice(0,10);
    if (getDayPct(k) < 80) break;
    s++; d.setDate(d.getDate()-1);
    if (s>365) break;
  }
  return s;
}

// ─── Header Update ─────────────────────────────────────────────────────────────
function updateHeader() {
  const today = todayKey();
  const dl = log[today] || {};
  const done = activities.filter(a=>dl[a.id]).length;
  const total = activities.length;
  const pct = total ? Math.round(done/total*100) : 0;
  const streak = calcStreak();

  document.getElementById("header-date").textContent = fmtDate(today).toUpperCase();
  document.getElementById("big-pct").innerHTML = pct + '<span>%</span>';
  document.getElementById("pct-label").textContent = done+"/"+total+" done";
  document.getElementById("streak-num").textContent = streak;

  const fill = document.getElementById("main-bar-fill");
  fill.style.width = pct+"%";
  fill.className = "main-bar-fill" + (pct===100?" complete":"");

  const catBars = document.getElementById("cat-bars");
  catBars.innerHTML = CATEGORIES.map(cat => {
    const cp = getCatPct(cat, today);
    const acc = CAT_META[cat].accent;
    return `<div class="cat-mini-bar"><div class="cat-mini-fill" style="width:${cp}%;background:${acc}"></div></div>`;
  }).join("");
}

// ─── Toast ─────────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2000);
}

// ─── Views ────────────────────────────────────────────────────────────────────
function renderToday() {
  const today = todayKey();
  const dl = log[today] || {};
  const quote = QUOTES[Math.floor(new Date(today).getTime()/86400000) % QUOTES.length];

  let html = `
    <div class="quote-card">
      <div class="quote-text">"${quote.text}"</div>
      <div class="quote-author">— ${quote.author}</div>
    </div>`;

  CATEGORIES.forEach(cat => {
    const items = activities.filter(a=>a.category===cat);
    if (!items.length) return;
    const pct = getCatPct(cat, today);
    const {accent, bg, icon} = CAT_META[cat];
    html += `<div class="cat-section">
      <div class="cat-header" style="background:${bg};border:1px solid ${accent}33">
        <span style="font-size:16px">${icon}</span>
        <span class="cat-header-label" style="color:${accent}">${cat}</span>
        <div class="cat-mini"><div class="cat-mini-inner" style="width:${pct}%;background:${accent}"></div></div>
        <span class="cat-pct-text" style="color:${accent}">${pct}%</span>
      </div>`;
    items.forEach(act => {
      const done = !!dl[act.id];
      html += `
        <div class="activity-item${done?" done":""}" data-id="${act.id}" onclick="toggleItem('${act.id}')">
          <div class="checkbox${done?" checked":" "}">${done?"✓":""}</div>
          <span class="act-emoji">${act.emoji}</span>
          <span class="act-label${done?" done":""}">${act.label}</span>
        </div>`;
    });
    html += `</div>`;
  });

  const todayNote = notes[today] || "";
  html += `
    <div style="margin-top:8px">
      <div class="section-title">📝 Today's Notes</div>
      <textarea class="note-area" id="note-area" placeholder="Reflect on your day, set intentions, note anything...">${todayNote}</textarea>
      <button class="save-btn" onclick="saveNote()">Save Note</button>
    </div>`;

  document.getElementById("body").innerHTML = html;
  adjustBodyTop();
}

function renderWeek() {
  const days = getDays(7);
  const avgPct = Math.round(days.reduce((s,d)=>s+getDayPct(d),0)/7);
  const strong = days.filter(d=>getDayPct(d)>=80).length;
  const streak = calcStreak();

  let html = `
    <div class="stat-row">
      <div class="stat-card"><div class="stat-val">${avgPct}%</div><div class="stat-lbl">Weekly Avg</div></div>
      <div class="stat-card"><div class="stat-val">${streak}</div><div class="stat-lbl">Streak 🔥</div></div>
      <div class="stat-card"><div class="stat-val">${strong}</div><div class="stat-lbl">Strong Days</div></div>
    </div>
    <div class="section-title">Daily Breakdown</div>
    <div class="day-grid">`;

  days.forEach(d => {
    const pct = getDayPct(d);
    const label = new Date(d+"T00:00:00").toLocaleDateString("en",{weekday:"short"});
    const bg = pct===0?"#131824":pct<50?"#2a1f0f":pct<80?"#2a2800":"#0f2a0f";
    const bc = pct===0?"#2a2e3a":pct<50?"#c9a84c44":pct<80?"#f0c96a44":"#5cb85c44";
    const tc = pct===0?"#444":pct<50?"#c9a84c":pct<80?"#f0c96a":"#5cb85c";
    html += `<div class="day-cell" style="background:${bg};border-color:${bc}">
      <div class="day-cell-date">${label}</div>
      <div class="day-cell-pct" style="color:${tc}">${pct}%</div>
    </div>`;
  });
  html += `</div><div class="section-title">Category Performance</div>`;

  const catAvgs = CATEGORIES.map(cat=>({cat,avg:Math.round(days.reduce((s,d)=>s+getCatPct(cat,d),0)/7)}))
    .sort((a,b)=>b.avg-a.avg);
  catAvgs.forEach(({cat,avg}) => {
    const acc = CAT_META[cat].accent;
    html += `<div class="cat-stat-row">
      <div class="cat-stat-label">
        <span class="cat-stat-name">${cat}</span>
        <span class="cat-stat-pct" style="color:${acc}">${avg}%</span>
      </div>
      <div class="cat-stat-bar"><div class="cat-stat-fill" style="width:${avg}%;background:${acc}"></div></div>
    </div>`;
  });

  const best = catAvgs[0], worst = catAvgs[catAvgs.length-1];
  const bestDay = days.reduce((b,d)=>getDayPct(d)>getDayPct(b)?d:b);
  html += `
    <div style="margin-top:16px">
      <div class="insight-card"><div class="insight-title">🔥 Most Consistent</div><div class="insight-text">${best.cat} at ${best.avg}% avg — keep it up!</div></div>
      <div class="insight-card"><div class="insight-title">⚠️ Needs Attention</div><div class="insight-text">${worst.cat} at ${worst.avg}% — prioritise this category this week.</div></div>
      <div class="insight-card"><div class="insight-title">🏆 Best Day</div><div class="insight-text">${fmtDate(bestDay)} — ${getDayPct(bestDay)}% completion</div></div>
    </div>`;

  document.getElementById("body").innerHTML = html;
  adjustBodyTop();
}

function renderMonth() {
  const days = getDays(30);
  const avgPct = Math.round(days.reduce((s,d)=>s+getDayPct(d),0)/30);
  const perfect = days.filter(d=>getDayPct(d)===100).length;
  const strong = days.filter(d=>getDayPct(d)>=80).length;

  let html = `
    <div class="stat-row">
      <div class="stat-card"><div class="stat-val">${avgPct}%</div><div class="stat-lbl">Monthly Avg</div></div>
      <div class="stat-card"><div class="stat-val">${strong}</div><div class="stat-lbl">Strong Days</div></div>
      <div class="stat-card"><div class="stat-val">${perfect}</div><div class="stat-lbl">Perfect Days</div></div>
    </div>
    <div class="section-title">30-Day Heatmap</div>
    <div class="heatmap">`;

  days.forEach(d => {
    const pct = getDayPct(d);
    const op = pct===0?0.08:0.15+(pct/100)*0.85;
    const day = new Date(d+"T00:00:00").getDate();
    const tc = pct>55?"#0d0f14":"#888";
    html += `<div class="heat-cell" style="background:rgba(201,168,76,${op.toFixed(2)});border:1px solid rgba(201,168,76,${(op*0.5).toFixed(2)})" title="${fmtDate(d)}: ${pct}%">
      <span class="heat-num" style="color:${tc}">${day}</span>
    </div>`;
  });
  html += `</div>`;

  // Weekly trend
  const weeks = [0,1,2,3].map(w=>{
    const wd = days.slice(w*7,(w+1)*7);
    return Math.round(wd.reduce((s,d)=>s+getDayPct(d),0)/wd.length);
  });
  const maxW = Math.max(...weeks, 1);
  html += `<div class="section-title">Weekly Trend</div><div class="week-bars">`;
  weeks.forEach((w,i)=>{
    html += `<div class="week-bar-wrap">
      <div class="week-bar-pct">${w}%</div>
      <div class="week-bar" style="height:${Math.max(6,w/maxW*80)}px"></div>
      <div class="week-bar-label">W${i+1}</div>
    </div>`;
  });
  html += `</div><div class="section-title">Category Averages</div>`;

  const catAvgs = CATEGORIES.map(cat=>({cat,avg:Math.round(days.reduce((s,d)=>s+getCatPct(cat,d),0)/30)}))
    .sort((a,b)=>b.avg-a.avg);
  catAvgs.forEach(({cat,avg})=>{
    const acc = CAT_META[cat].accent;
    html += `<div class="cat-stat-row">
      <div class="cat-stat-label">
        <span class="cat-stat-name">${cat}</span>
        <span class="cat-stat-pct" style="color:${acc}">${avg}%</span>
      </div>
      <div class="cat-stat-bar"><div class="cat-stat-fill" style="width:${avg}%;background:${acc}"></div></div>
    </div>`;
  });

  const improving = weeks[3] > weeks[0];
  const best = catAvgs[0], worst = catAvgs[catAvgs.length-1];
  html += `
    <div style="margin-top:16px">
      <div class="insight-card">
        <div class="insight-title">${improving?"📈 Trending Up":"📉 Needs Consistency"}</div>
        <div class="insight-text">${improving?`Improved from ${weeks[0]}% (W1) to ${weeks[3]}% (W4). Great momentum!`:`Week 4 avg (${weeks[3]}%) is below Week 1 (${weeks[0]}%). Time to refocus.`}</div>
      </div>
      <div class="insight-card"><div class="insight-title">🏆 Strongest Category</div><div class="insight-text">${best.cat} averaged ${best.avg}% this month.</div></div>
      <div class="insight-card"><div class="insight-title">💡 Growth Area</div><div class="insight-text">${worst.cat} averaged only ${worst.avg}% — one small habit change can shift this.</div></div>
    </div>`;

  document.getElementById("body").innerHTML = html;
  adjustBodyTop();
}

function renderManage() {
  let html = `
    <div class="section-title">➕ Add Activity</div>
    <div class="add-row">
      <input class="add-emoji-input" id="new-emoji" value="⭐" maxlength="2" placeholder="🔥"/>
      <input class="add-text-input" id="new-label" placeholder="Activity name..." onkeydown="if(event.key==='Enter')addActivity()"/>
      <select id="new-cat">${CATEGORIES.map(c=>`<option>${c}</option>`).join("")}</select>
      <button class="add-btn" onclick="addActivity()">Add</button>
    </div>`;

  CATEGORIES.forEach(cat => {
    const items = activities.filter(a=>a.category===cat);
    if (!items.length) return;
    const acc = CAT_META[cat].accent;
    html += `<div style="margin-bottom:18px">
      <div class="manage-cat-label" style="color:${acc}">${cat}</div>`;
    items.forEach(act => {
      if (editingId === act.id) {
        html += `<div class="manage-item">
          <span style="font-size:16px">${act.emoji}</span>
          <input class="edit-input" id="edit-input-${act.id}" value="${act.label}" onkeydown="if(event.key==='Enter')saveEdit('${act.id}');if(event.key==='Escape')cancelEdit()"/>
          <button class="icon-btn" style="color:#5cb85c" onclick="saveEdit('${act.id}')">✓</button>
          <button class="icon-btn" style="color:#888" onclick="cancelEdit()">✕</button>
        </div>`;
      } else {
        html += `<div class="manage-item">
          <span style="font-size:16px">${act.emoji}</span>
          <span class="manage-label">${act.label}</span>
          <button class="icon-btn" style="color:#4d9de0" onclick="startEdit('${act.id}')">✎</button>
          <button class="icon-btn" style="color:#e05252" onclick="removeActivity('${act.id}')">🗑</button>
        </div>`;
      }
    });
    html += `</div>`;
  });

  document.getElementById("body").innerHTML = html;
  adjustBodyTop();
  if (editingId) {
    const el = document.getElementById("edit-input-"+editingId);
    if (el) { el.focus(); el.select(); }
  }
}

// ─── Actions ──────────────────────────────────────────────────────────────────
function toggleItem(id) {
  const today = todayKey();
  if (!log[today]) log[today] = {};
  log[today][id] = !log[today][id];
  save(); updateHeader();
  const item = document.querySelector(`[data-id="${id}"]`);
  if (item) {
    const done = log[today][id];
    item.classList.toggle("done", done);
    const cb = item.querySelector(".checkbox");
    cb.className = "checkbox" + (done?" checked":"");
    cb.textContent = done ? "✓" : "";
    const lbl = item.querySelector(".act-label");
    lbl.className = "act-label" + (done?" done":"");
    if (done) showToast("✓ Done!");
    // update cat bar
    renderCatBar(document.querySelector(`[data-id="${id}"]`)?.closest(".cat-section"), 
      activities.find(a=>a.id===id)?.category);
  }
}

function renderCatBar(section, cat) {
  if (!section || !cat) return;
  const pct = getCatPct(cat, todayKey());
  const bar = section.querySelector(".cat-mini-inner");
  if (bar) bar.style.width = pct+"%";
  const txt = section.querySelector(".cat-pct-text");
  if (txt) txt.textContent = pct+"%";
}

function saveNote() {
  const ta = document.getElementById("note-area");
  if (!ta) return;
  notes[todayKey()] = ta.value;
  save(); showToast("📝 Note saved!");
}

function addActivity() {
  const emoji = document.getElementById("new-emoji")?.value.trim() || "⭐";
  const label = document.getElementById("new-label")?.value.trim();
  const cat = document.getElementById("new-cat")?.value;
  if (!label) return;
  activities.push({id:"u"+Date.now(), category:cat, label, emoji});
  save(); updateHeader(); renderManage(); showToast("✓ Activity added!");
}

function removeActivity(id) {
  if (!confirm("Remove this activity?")) return;
  activities = activities.filter(a=>a.id!==id);
  save(); updateHeader(); renderManage();
}

function startEdit(id) { editingId = id; renderManage(); }
function cancelEdit() { editingId = null; renderManage(); }
function saveEdit(id) {
  const val = document.getElementById("edit-input-"+id)?.value.trim();
  if (!val) return;
  activities = activities.map(a=>a.id===id?{...a,label:val}:a);
  editingId = null; save(); renderManage(); showToast("✓ Updated!");
}

// ─── Nav ──────────────────────────────────────────────────────────────────────
document.getElementById("nav").addEventListener("click", e => {
  const btn = e.target.closest(".nav-btn");
  if (!btn) return;
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  currentView = btn.dataset.view;
  editingId = null;
  renderView();
});

function renderView() {
  if (currentView==="today") renderToday();
  else if (currentView==="week") renderWeek();
  else if (currentView==="month") renderMonth();
  else renderManage();
}

// ─── Body Top Offset ──────────────────────────────────────────────────────────
function adjustBodyTop() {
  const h = document.getElementById("header").offsetHeight;
  document.getElementById("body").style.marginTop = h+"px";
}

// ─── PWA Install ─────────────────────────────────────────────────────────────
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); deferredPrompt = e;
  if (!localStorage.getItem("install-dismissed")) {
    document.getElementById("install-banner").style.display = "block";
  }
});
document.getElementById("install-yes-btn").addEventListener("click", async () => {
  document.getElementById("install-banner").style.display = "none";
  if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; }
});
document.getElementById("install-no-btn").addEventListener("click", () => {
  document.getElementById("install-banner").style.display = "none";
  localStorage.setItem("install-dismissed","1");
});

// ─── Service Worker ───────────────────────────────────────────────────────────
if ("serviceWorker" in navigator) {
  const swCode = `
const CACHE = "daily-ops-v1";
const ASSETS = [self.location.pathname];
self.addEventListener("install", e => { e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS))); self.skipWaiting(); });
self.addEventListener("activate", e => { e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k))))); self.clients.claim(); });
self.addEventListener("fetch", e => { e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{ if(res.ok&&e.request.method==="GET"){ const c=res.clone(); caches.open(CACHE).then(ca=>ca.put(e.request,c)); } return res; }))); });
  `;
  const swBlob = new Blob([swCode], {type:"text/javascript"});
  const swURL = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swURL).catch(()=>{});
}

// ─── Init ──────────────────────────────────────────────────────────────────────
window.addEventListener("load", () => {
  document.getElementById("loading").style.display = "none";
  updateHeader(); renderView();
  window.addEventListener("resize", adjustBodyTop);
});
</script>
</body>
</html>
